<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
</head>

<body>
  <p>Redirecting...</p>

  <p id="fallback" style="display: none;">
    If you are not redirected,
    <a id="link" href="#">click here</a>.
  </p>

  <script>
    fetch("../link.txt?v=" + Date.now(), {
      cache: "no-store"
    })
      .then(response => response.text())
      .then(text => {
        const links = text.split(/\r?\n/);
        const link = links[0].trim();
  
        if (link) {
          window.location.replace(link);
        }
      });
  </script>
</body>
</html>
